<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Cat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #f0f4fd 0%, #e3e9f9 45%, #d5ddf2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem 1rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .cat-wrap {
      width: min(320px, 80vw);
      filter: drop-shadow(0 12px 24px rgba(70, 82, 120, 0.18));
      animation: float 4s ease-in-out infinite;
    }

    .cat-wrap svg {
      display: block;
      width: 100%;
      height: auto;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      color: #3f4866;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      color: #7681a3;
      line-height: 1.6;
    }

    @media (prefers-reduced-motion: reduce) {
      .cat-wrap { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="cat-wrap">
      <svg viewBox="0 0 320 300" role="img" aria-label="Friendly cartoon British Shorthair cat">
        <!-- tail: thick and plush -->
        <path d="M254 228 q46 -4 42 -50 q-2 -20 -20 -26" fill="none" stroke="#838bb3" stroke-width="20" stroke-linecap="round"/>
        <!-- body: stocky and sturdy -->
        <ellipse cx="186" cy="234" rx="86" ry="56" fill="#9aa2c9"/>
        <!-- back leg -->
        <ellipse cx="232" cy="262" rx="26" ry="20" fill="#838bb3"/>
        <!-- front legs: short and thick -->
        <rect x="124" y="248" width="24" height="36" rx="12" fill="#9aa2c9"/>
        <rect x="160" y="252" width="24" height="32" rx="12" fill="#8d95bd"/>
        <!-- ears: small, rounded, wide-set -->
        <path d="M62 96 Q48 42 70 38 Q96 46 112 62 Z" fill="#838bb3"/>
        <path d="M70 86 Q62 54 74 50 Q92 58 102 66 Z" fill="#e8a8b8"/>
        <path d="M174 96 Q188 42 166 38 Q140 46 124 62 Z" fill="#838bb3"/>
        <path d="M166 86 Q174 54 162 50 Q144 58 134 66 Z" fill="#e8a8b8"/>
        <!-- head: big and round -->
        <circle cx="118" cy="134" r="74" fill="#9aa2c9"/>
        <!-- round full cheeks -->
        <circle cx="62" cy="164" r="30" fill="#9aa2c9"/>
        <circle cx="174" cy="164" r="30" fill="#9aa2c9"/>
        <!-- cheek fluff -->
        <path d="M36 150 q-8 8 -3 16 M40 172 q-8 6 -3 14 M200 150 q8 8 3 16 M196 172 q8 6 3 14"
              fill="none" stroke="#b6bcd9" stroke-width="4" stroke-linecap="round"/>
        <!-- muzzle -->
        <ellipse cx="118" cy="172" rx="40" ry="26" fill="#b6bcd9"/>
        <!-- eyes: big, round, copper -->
        <circle cx="86" cy="128" r="15" fill="#f0a03c"/>
        <circle cx="150" cy="128" r="15" fill="#f0a03c"/>
        <circle cx="86" cy="128" r="7" fill="#2e2b45"/>
        <circle cx="150" cy="128" r="7" fill="#2e2b45"/>
        <circle cx="89" cy="124" r="3.5" fill="#ffffff"/>
        <circle cx="153" cy="124" r="3.5" fill="#ffffff"/>
        <!-- nose -->
        <path d="M110 156 h16 l-8 10 Z" fill="#d9748c"/>
        <!-- mouth -->
        <path d="M118 166 v7 M118 173 q-10 9 -20 2 M118 173 q10 9 20 2"
              fill="none" stroke="#33304a" stroke-width="4" stroke-linecap="round"/>
        <!-- whiskers -->
        <path d="M70 152 q-26 -6 -44 -12 M72 164 q-28 0 -48 -2 M72 176 q-26 6 -44 12"
              fill="none" stroke="#7d84a8" stroke-width="3" stroke-linecap="round"/>
        <path d="M166 152 q26 -6 44 -12 M164 164 q28 0 48 -2 M164 176 q26 6 44 12"
              fill="none" stroke="#7d84a8" stroke-width="3" stroke-linecap="round"/>
        <!-- collar -->
        <path d="M82 200 q38 20 74 2 l-3 13 q-34 15 -68 -2 Z" fill="#e5b84e"/>
        <circle cx="120" cy="214" r="7" fill="#d95d4e"/>
      </svg>
    </div>
    <h1>Meet Thunder</h1>
    <p>A very good British Shorthair, rendered entirely in SVG. No pixels were harmed.</p>
  </main>
</body>
</html>

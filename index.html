<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Cat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #f0f4fd 0%, #e3e9f9 45%, #d5ddf2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem 1rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .cat-wrap {
      width: min(320px, 80vw);
      filter: drop-shadow(0 12px 24px rgba(70, 82, 120, 0.18));
      animation: float 4s ease-in-out infinite;
    }

    .cat-wrap svg {
      display: block;
      width: 100%;
      height: auto;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      color: #3f4866;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      color: #7681a3;
      line-height: 1.6;
    }

    @media (prefers-reduced-motion: reduce) {
      .cat-wrap { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="cat-wrap">
      <svg viewBox="0 0 320 300" role="img" aria-label="Friendly cartoon cat">
        <!-- tail -->
        <path d="M248 230 q52 -6 44 -58 q-4 -24 -26 -28" fill="none" stroke="#8c93b8" stroke-width="16" stroke-linecap="round"/>
        <!-- body -->
        <ellipse cx="182" cy="234" rx="80" ry="52" fill="#a4abce"/>
        <!-- chest patch -->
        <ellipse cx="146" cy="246" rx="34" ry="32" fill="#f4f0fa"/>
        <!-- back leg -->
        <ellipse cx="226" cy="264" rx="24" ry="18" fill="#8c93b8"/>
        <!-- front legs -->
        <rect x="126" y="242" width="20" height="42" rx="10" fill="#a4abce"/>
        <rect x="160" y="246" width="20" height="38" rx="10" fill="#959cc2"/>
        <!-- left ear -->
        <path d="M62 96 L48 34 L110 62 Z" fill="#8c93b8"/>
        <path d="M68 88 L59 50 L98 68 Z" fill="#e8a8b8"/>
        <!-- right ear -->
        <path d="M174 96 L188 34 L126 62 Z" fill="#8c93b8"/>
        <path d="M168 88 L177 50 L138 68 Z" fill="#e8a8b8"/>
        <!-- head -->
        <circle cx="118" cy="132" r="70" fill="#a4abce"/>
        <!-- forehead stripes -->
        <path d="M104 66 q4 14 0 24 M118 62 q2 14 0 26 M132 66 q-4 14 0 24"
              fill="none" stroke="#8c93b8" stroke-width="6" stroke-linecap="round"/>
        <!-- muzzle patch -->
        <ellipse cx="118" cy="164" rx="42" ry="30" fill="#f4f0fa"/>
        <!-- eyes -->
        <circle cx="90" cy="124" r="9" fill="#33304a"/>
        <circle cx="146" cy="124" r="9" fill="#33304a"/>
        <circle cx="93" cy="121" r="3" fill="#ffffff"/>
        <circle cx="149" cy="121" r="3" fill="#ffffff"/>
        <!-- nose -->
        <path d="M110 148 h16 l-8 10 Z" fill="#e8788f"/>
        <!-- mouth -->
        <path d="M118 158 v8 M118 166 q-10 10 -20 3 M118 166 q10 10 20 3"
              fill="none" stroke="#33304a" stroke-width="4" stroke-linecap="round"/>
        <!-- whiskers -->
        <path d="M76 146 q-24 -6 -42 -14 M78 158 q-26 0 -46 -2 M78 170 q-24 6 -42 12"
              fill="none" stroke="#7d84a8" stroke-width="3" stroke-linecap="round"/>
        <path d="M160 146 q24 -6 42 -14 M158 158 q26 0 46 -2 M158 170 q24 6 42 12"
              fill="none" stroke="#7d84a8" stroke-width="3" stroke-linecap="round"/>
        <!-- collar -->
        <path d="M80 194 q40 20 78 2 l-3 13 q-36 15 -72 -2 Z" fill="#e5b84e"/>
        <circle cx="120" cy="208" r="7" fill="#d95d4e"/>
      </svg>
    </div>
    <h1>Meet Stormie</h1>
    <p>A very good cat, rendered entirely in SVG. No pixels were harmed.</p>
  </main>
</body>
</html>
